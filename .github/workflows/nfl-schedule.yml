name: NFL schedule

# Refreshes data/nfl_schedule.json (the next ~9 days of kickoffs from ESPN's public scoreboard; no Yahoo
# requests) so live.yml knows when games are on, including flexed, international and holiday games.
# Commits only when kickoffs change, or every few days to keep the file fresh.
on:
  schedule:
    - cron: "0 10 * * *"   # daily, ~5-6 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: python3 -m museum.nfl_schedule fetch

      - name: Commit schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update NFL schedule ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
