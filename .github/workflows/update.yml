name: Update & deploy museum

on:
  schedule:
    # Tuesdays 13:00 UTC (8–9 AM Eastern), after Monday Night Football is final.
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every season from Yahoo (ignores the cache)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: museum-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HAS_YAHOO_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN != '' }}
      HAS_YAHOO_COOKIES: ${{ secrets.YAHOO_COOKIES != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Preferred while the Yahoo API app is unapproved: read the league's web pages with browser cookies.
      - name: Scrape Yahoo pages (incremental)
        id: scrape
        if: github.event_name != 'push' && env.HAS_YAHOO_COOKIES == 'true'
        continue-on-error: true
        env:
          YAHOO_COOKIES: ${{ secrets.YAHOO_COOKIES }}
          YAHOO_SEASONS: ${{ vars.YAHOO_SEASONS }}
        run: |
          python -m museum scrape --time-budget 300 ${{ inputs.full && '--full' || '' }} || {
            echo "::error::Scrape failed — if the log mentions the login page, refresh the YAHOO_COOKIES secret (README → Scraping with browser cookies)."
            exit 1
          }

      - name: Ingest from Yahoo API (incremental)
        id: ingest
        if: github.event_name != 'push' && env.HAS_YAHOO_TOKEN == 'true' && env.HAS_YAHOO_COOKIES != 'true'
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_GAME_ID: ${{ vars.YAHOO_GAME_ID }}
        run: python -m museum ingest --time-budget 300 ${{ inputs.full && '--full' || '' }}

      - name: Commit updated database
        if: always() && (steps.ingest.conclusion != 'skipped' || steps.scrape.conclusion != 'skipped')
        run: |
          has_data=$(python -c "from museum.db import has_league_data; print(int(has_league_data('data/league.sqlite')))")
          if [ "$has_data" != "1" ]; then
            echo "No league data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league.sqlite
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update league data ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Generate sample data (until real data exists)
        run: |
          has_data=$(python -c "from museum.db import has_league_data; print(int(has_league_data('data/league.sqlite')))")
          if [ "$has_data" != "1" ]; then
            echo "::notice::No data/league.sqlite yet — building the site from sample data."
            python -m museum sample
          fi

      # Best effort (1 request): keeps the Lobby's live/upcoming scoreboard on non-live deploys too.
      - name: Live scoreboard snapshot
        if: env.HAS_YAHOO_COOKIES == 'true'
        continue-on-error: true
        env:
          YAHOO_COOKIES: ${{ secrets.YAHOO_COOKIES }}
          YAHOO_SEASONS: ${{ vars.YAHOO_SEASONS }}
        run: python -m museum scrape --live --delay 0

      - run: python -m museum stats

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
