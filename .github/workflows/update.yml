name: Update & deploy museum

on:
  schedule:
    # Tuesdays 13:00 UTC (8–9 AM Eastern), after Monday Night Football is final.
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch every season from Yahoo (ignores the cache)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: museum-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HAS_YAHOO_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest from Yahoo (incremental)
        id: ingest
        if: github.event_name != 'push' && env.HAS_YAHOO_TOKEN == 'true'
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_GAME_ID: ${{ vars.YAHOO_GAME_ID }}
        run: python -m museum ingest --time-budget 300 ${{ inputs.full && '--full' || '' }}

      - name: Commit updated database
        if: always() && steps.ingest.conclusion != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league.sqlite
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update league data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Generate sample data (until real data exists)
        run: |
          if [ ! -f data/league.sqlite ]; then
            echo "::notice::No data/league.sqlite yet — building the site from sample data."
            python -m museum sample
          fi

      - run: python -m museum stats

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
