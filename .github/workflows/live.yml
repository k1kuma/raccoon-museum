name: Live scores

# Live scores during NFL games: read only the current week's scoreboard through Yahoo's approved API, rebuild and deploy.
# Nothing is committed — live scores live only in the deployed site, and records, streaks and standings keep
# using final weeks from data/league.sqlite (committed by the Tuesday run).
#
# The cron fires every 15 minutes all week, but the first step is a seconds-long gate that reads this week's
# kickoffs from data/nfl_schedule.json (refreshed daily by nfl-schedule.yml) and stops unless a game is on:
# kickoff −15 min → kickoff +4 h, plus one final refresh after the last window. International, Saturday,
# Thanksgiving and Christmas games are picked up automatically. If the schedule file is missing or stale,
# it falls back to fixed Sunday/Monday/Thursday windows and logs a warning.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  # Outside the concurrency group: these quick checks run every 15 minutes and must never bump a queued Tuesday run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      live: ${{ steps.window.outputs.live }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            museum
            data/nfl_schedule.json
          sparse-checkout-cone-mode: false

      - name: Game window?
        id: window
        run: python3 -m museum.nfl_schedule gate ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

  build:
    needs: gate
    if: needs.gate.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared with "Update & deploy museum" so a live deploy never races the Tuesday data commit.
    concurrency:
      group: museum-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fails the job (so nothing is deployed and the live site keeps its last good build) when OAuth expires.
      - name: Fetch live scoreboard from Yahoo API
        id: fetch
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_GAME_ID: ${{ vars.YAHOO_GAME_ID }}
        run: |
          set +e
          python -m museum ingest --live --delay 0
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ]; then
            echo "::error::Live API fetch failed (exit $code) — refresh YAHOO_REFRESH_TOKEN with scripts/auth.py if the token was revoked. The site was not redeployed."
          fi
          exit $code

      # Opens (or comments on, at most every 6 h) a `scrape-failure` issue; the next good fetch closes it.
      - name: Report live fetch status
        if: always() && steps.fetch.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scrape_alert.py ${{ steps.fetch.outcome == 'success' && 'ok' || 'fail' }}
          --code "${{ steps.fetch.outputs.code }}" --workflow "${{ github.workflow }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Generate museum data
        run: python -m museum stats

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: museum-update
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
