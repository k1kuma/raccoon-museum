name: Recover failed workflows

on:
  workflow_run:
    workflows: ["Live scores", "Update & deploy museum", "NFL schedule"]
    branches: [main]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: recover-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
    steps:
      - name: Retry or hand off workflow failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_REPAIR_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$RUN_SHA" != "$main_sha" ]]; then
            echo "Run used an older main revision. Skipping retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          run_api="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          attempt=$(gh api "$run_api" --jq .run_attempt)
          if [[ "$attempt" != "$RUN_ATTEMPT" ]]; then
            exit 0
          fi

          failed_steps=$(gh api --paginate "$run_api/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name' \
            | LC_ALL=C sort -u)
          if [[ "$failed_steps" == "Scrape live scoreboard" ]]; then
            echo "The Yahoo scrape alert handles this failure." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          retryable=true
          while IFS= read -r step; do
            case "$step" in
              "Set up job"|"Run actions/checkout@v4"|"Run actions/setup-python@v5"|"Run actions/setup-node@v4"|"Run actions/configure-pages@v5"|"Run actions/upload-pages-artifact@v3"|"Run actions/deploy-pages@v4") ;;
              *) retryable=false ;;
            esac
          done <<< "$failed_steps"

          if [[ "$retryable" == true && "$RUN_ATTEMPT" == 1 ]]; then
            gh api --method POST "$run_api/rerun-failed-jobs"
            echo "Requested one retry for run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          signature=$(printf '%s' "$failed_steps" | sha256sum | cut -c1-12)
          title="Workflow failure: $RUN_WORKFLOW [$signature]"
          issue=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            | jq -sc --arg title "$title" '[.[][] | select(.title == $title and .pull_request == null)] | first // empty')
          if [[ -z "$issue" ]]; then
            body=$(printf 'Investigate the failure and propose a tested fix in a pull request. Preserve workflow permissions and secret handling. Use the linked run as diagnostic evidence. If the failure is external and has no code fix, explain the cause on this issue.\n\nRun: %s (attempt %s)\nRevision: `%s`\n\nFailed steps:\n' "$RUN_URL" "$RUN_ATTEMPT" "$RUN_SHA")
            steps=$(printf '%s\n' "${failed_steps:-GitHub did not identify a failed step.}" | sed 's/^/    /')
            issue=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="$title" -f body="$body"$'\n\n'"$steps")
          fi
          number=$(jq -r .number <<< "$issue")
          if jq -e 'any(.assignees[]; .login == "copilot-swe-agent[bot]")' <<< "$issue" >/dev/null; then
            echo "Copilot is already assigned to issue #$number." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$COPILOT_TOKEN" ]]; then
            echo "::warning::Issue #$number is ready. Configure COPILOT_REPAIR_TOKEN for automatic assignment."
          else
            jq -n --arg repo "$GITHUB_REPOSITORY" '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {target_repo: $repo, base_branch: "main", custom_instructions: "", custom_agent: "", model: ""}
            }' | GH_TOKEN="$COPILOT_TOKEN" gh api --method POST \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/issues/$number/assignees" --input - \
              --jq '.assignees[] | select(.login == "copilot-swe-agent[bot]") | .login' \
              | grep -Fxq 'copilot-swe-agent[bot]'
            echo "Assigned issue #$number to Copilot." >> "$GITHUB_STEP_SUMMARY"
          fi
